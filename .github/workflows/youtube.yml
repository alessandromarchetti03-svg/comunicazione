name: Aggiorna video YouTube e caratteri

on:
  schedule:
    - cron: "17 */6 * * *"   # ogni 6 ore
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare subito

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # ✏️ Incolla qui l'ID del tuo canale (inizia con UC...)
      YT_CHANNEL_ID: "UChzn_LKY3UXMd2PYOynDUOQ"
      YT_MAX: "6"
      YT_EXCLUDE_SHORTS: "true"   # metti "true" per escludere gli Shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Caratteri sul sito (solo la prima volta)
        run: test -f fonts/fonts.css || python fetch-fonts.py
      - run: python update-videos.py
      - name: Salva se ci sono video nuovi
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json yt fonts
          git diff --cached --quiet || (git commit -m "Aggiorna video YouTube e caratteri" && git push)
