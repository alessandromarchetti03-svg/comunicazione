name: Aggiorna video YouTube e caratteri

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CHANNEL_ID: "UChzn_LKY3UXMd2PYOynDUOQ"
      YT_MAX: "6"
      YT_EXCLUDE_SHORTS: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Caratteri sul sito (solo la prima volta)
        run: test -f fonts/fonts.css || python3 fetch-fonts.py
      - name: Ultimi video del canale
        run: python3 update-videos.py
      - name: Salva le modifiche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A videos.json yt fonts 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna video YouTube e caratteri"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 15; done
          fi
